<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savior Dog Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- Logo -->
        <div class="logo-text">
            <h1 class="curve-down">Sa<span class="curve-up">vor</span></h1>
            <h2 class="curve-up">Dog<span class="curve-down">Food</span></h2>
        </div>
        <!-- Nav Bar -->
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- hero section -->
        <section id="hero" class="hero-section">
            <!-- left column -->
            <div class="col-1">   
                <div class="slogan">
                    <h1>Human-grade.</h1> 
                    <h1>dog approved.</h1>
                </div>
                <p>Nutritious, delicious meals made with real ingredients — crafted for wagging tails and healthy lives.</p>
                <div class="buttons">
                    <a href="#products" class="btn-primary">Our Food</a>
                    <a href="#about" class="btn-secondary">Our Story</a>
                </div>
            </div>
            <!-- right column -->
            <div class="col-2">
                <img src="./assets/hero-dog.png" alt="Dog Food Hero Image">
            </div>
        </section>
         
        
            
    </main>
</body>
</html>
